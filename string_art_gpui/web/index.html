<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>String Art</title>
<style>
	html,
	body {
		margin: 0;
		height: 100%;
		overflow: hidden;
		background: #1e1e1e;
		color: #eeeeee;
		font-family: system-ui, -apple-system, sans-serif;
	}
	#status {
		position: absolute;
		inset: 0;
		display: flex;
		flex-direction: column;
		gap: 8px;
		align-items: center;
		justify-content: center;
		text-align: center;
		padding: 24px;
		font-size: 15px;
		line-height: 1.5;
	}
	#status small {
		color: #9a9a9a;
		font-size: 13px;
	}
</style>
</head>
<body>
	<div id="status">
		<strong>loading String Art…</strong>
		<small id="detail">compiling the module</small>
	</div>

	<script type="module">
		const status = document.getElementById("status");
		const detail = document.getElementById("detail");

		// Without origin isolation there is no SharedArrayBuffer and gpui falls
		// back to a single thread. We warn instead of letting it look slow.
		const isolated = globalThis.crossOriginIsolated === true;
		const hasSharedArrayBuffer = typeof SharedArrayBuffer !== "undefined";

		detail.textContent = isolated && hasSharedArrayBuffer
			? `shared memory available · ${navigator.hardwareConcurrency} cores`
			: `no origin isolation (COOP/COEP) · single thread`;

		try {
			const { default: init } = await import("./string_art_gpui.js");
			await init();
			status.remove();
		} catch (error) {
			status.innerHTML =
				`<strong>Failed to start</strong><small>${String(error)}</small>`;
			console.error(error);
		}
	</script>
</body>
</html>

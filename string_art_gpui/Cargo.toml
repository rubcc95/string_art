[package]
name = "string_art_gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
string_art = { workspace = true, features = ["threads"] }
string_art_sync = { workspace = true, features = ["threads"] }
image = { workspace = true }
web-time = "1.1"
# Zed consume gpui con `default-features = false`: las features de plataforma
# las activa `gpui_platform` según el target. Sus defaults aquí no aportan nada
# y en wasm arrastran `windows-manifest`/`embed-resource` al build del host.
gpui = { git = "https://github.com/zed-industries/zed", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed" }

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_env = "ohos")))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["x11", "wayland"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
# Misma rev que usa gpui_web para no duplicar el crate. `num_cpus::get()`
# devuelve siempre 1 en wasm32; `wasm_thread::available_parallelism()` lee
# `navigator.hardwareConcurrency`.
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", features = ["es_modules"] }

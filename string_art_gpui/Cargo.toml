[package]
name = "string_art_gpui"
version = "0.1.0"
edition = "2024"

[features]
default = ["multithreaded"]
# Real threads: `GpuiExec` and the gpui_web multithreaded pool (which needs
# nightly + `build-std` + a page with COOP/COEP). Without this feature the app
# compiles on stable and uses `Serial`.
multithreaded = [
    "gpui_platform/multithreaded",
    "string_art/multithreaded",
    "dep:wasm_thread",
]

[dependencies]
string_art = { workspace = true }
string_art_sync = { workspace = true }
string_art_serial = { workspace = true }
image = { workspace = true }
web-time = "1.1"
# Zed consumes gpui with `default-features = false`: platform features
# are enabled by `gpui_platform` depending on the target. Its defaults here add nothing
# and on wasm they drag `windows-manifest`/`embed-resource` into the host build.
gpui = { git = "https://github.com/zed-industries/zed", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", default-features = false }

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_env = "ohos")))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
# Same rev that gpui_web uses to avoid duplicating the crate. `num_cpus::get()`
# always returns 1 on wasm32; `wasm_thread::available_parallelism()` reads
# `navigator.hardwareConcurrency`.
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", features = ["es_modules"], optional = true }

[dev-dependencies]
# `ThreadedDispatcher` (feature `bench-support`): multithreaded pool without a window,
# to measure `GpuiExec` repeatably with `cargo test --release`.
gpui = { git = "https://github.com/zed-industries/zed", default-features = false, features = ["bench-support"] }

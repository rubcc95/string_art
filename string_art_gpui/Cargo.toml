[package]
name = "string_art_gpui"
description = "GPUI frontend for string_art."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# ICU4X 2.4 needs Rust 1.88. Only the GUI crate uses it, so the publishable
# core crates keep the workspace's older MSRV.
rust-version = "1.88"
# Not publishable: gpui, gpui_platform and wasm_thread are git dependencies,
# which crates.io rejects. Set explicitly instead of inheriting `publish`.
publish = false

[features]
default = ["multithreaded"]
# Real threads: GpuiExec and the gpui_web multithreaded pool (which needs
# nightly + build-std + a page with COOP/COEP). Without this feature the app
# compiles on stable and uses Serial.
multithreaded = [
    "gpui_platform/multithreaded",
    "dep:wasm_thread",
]

[dependencies]
string_art = { workspace = true }
string_art_serial = { workspace = true }
image = { workspace = true, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = "1"
rust-i18n = "4"
icu_decimal = "2"
icu_locale_core = "2"
icu_plurals = "2"
web-time = "1.1"
gpui = { git = "https://github.com/zed-industries/zed", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", default-features = false }

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_env = "ohos")))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rfd = "0.18"
directories = "6"
sys-locale = "0.3"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
sys-locale = { version = "0.3", features = ["js"] }
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", features = ["es_modules"], optional = true }
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "Blob",
    "console",
    "DataTransfer",
    "Document",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "Storage",
    "Window",
] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", default-features = false, features = ["bench-support"] }
serde_yaml = "0.9"

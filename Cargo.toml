[workspace]
resolver = "2"
members = [
    "string_art",
    "string_art/string_art_geometry",
    "string_art/string_art_grid",
    "string_art/string_art_color",
    "string_art/string_art_sync",
    "string_art/string_art_serial",
    "string_art/string_art_rayon",
    "string_art_gpui",
]

[workspace.dependencies]
# Internal crates. Paths are relative to this manifest, so the
# members do not depend on where they are placed inside the workspace.
string_art = { path = "string_art" }
string_art_sync = { path = "string_art/string_art_sync", default-features = false }
string_art_geometry = { path = "string_art/string_art_geometry", default-features = false }
string_art_grid = { path = "string_art/string_art_grid" }
string_art_serial = { path = "string_art/string_art_serial" }
string_art_rayon = { path = "string_art/string_art_rayon" }
string_art_color = { path = "string_art/string_art_color", default-features = false }

num-traits = "^0.2"
thiserror = "^2.0"
# No defaults: the formats that are needed are enabled by whoever decodes. With
# the defaults, `image` pulls the AVIF encoder (`ravif`/`rav1e`) into everyone.
image = { version = "^0.25", default-features = false }
serde = { version = "^1.0", features = ["derive"] }
derive_more = { version = "^2.0", features = ["deref", "deref_mut", "from"] }

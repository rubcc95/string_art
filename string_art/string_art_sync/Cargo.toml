[package]
name = "string_art_sync"
version = "0.1.0"
edition = "2024"

[features]
# Sin hilos por defecto: el core es monohilo salvo que alguien pida un backend
# paralelo (rayon, o `string_art_gpui`).
default = []
# Backends que cruzan hilos de verdad (rayon nativo, hilos de wasm).
#
# Con esto apagado `CondSend`/`CondSync` son vacíos: nada sale de su hilo, así
# que un `Anchor` con `Rc` dentro es perfectamente válido. Con esto encendido
# vuelven a ser `Send`/`Sync` reales, que es lo que exige el backend al repartir
# trabajo.
threads = ["dep:rayon", "dep:num_cpus"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { version = "^1.10", optional = true }
num_cpus = { version = "^1.16", optional = true }

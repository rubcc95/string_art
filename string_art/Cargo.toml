[package]
name = "string_art"
version = "0.1.0"
edition = "2024"


[dependencies]
string_art_sync = { workspace = true }
string_art_geometry = { workspace = true }
string_art_color = { workspace = true }
derive_more = { workspace = true }
thiserror = { workspace = true }
fixed = "^1.29"

# Optional
## Feature "image"
image = { workspace = true, optional = true }

## Feature "serde"
serde = { workspace = true, optional = true }

[features]
default = ["image"]
image = ["dep:image", "string_art_color/image"]
serde = ["dep:serde", "string_art_geometry/serde", "fixed/serde"]
# Real threads. Without this, the computation is single-threaded and `Anchor`
# does not have to be `Send`/`Sync`. Enabled by anyone using a parallel backend (rayon, gpui).
multithreaded = ["string_art_sync/multithreaded"]

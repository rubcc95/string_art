[package]
name = "string_art"
description = "Convert images into thread patterns for creating string art, with textual instructions and a graphical preview."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish.workspace = true
exclude = [".vscode"]


[dependencies]
string_art_executor = { workspace = true }
string_art_geometry = { workspace = true }
string_art_color = { workspace = true }
derive_more = { workspace = true }
thiserror = { workspace = true }
fixed = "^1.29"

# Optional
## Feature "image"
image = { workspace = true, optional = true }

## Feature "serde"
serde = { workspace = true, optional = true }

[features]
default = ["image", "clip", "cached"]
image = ["dep:image", "string_art_color/image"]
clip = []
cached = []
serde = ["dep:serde", "string_art_geometry/serde", "fixed/serde"]

[[bench]]
name = "walk"
harness = false

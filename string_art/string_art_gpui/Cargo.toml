[package]
name = "string_art_gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
string_art_sync = { path = "../string_art_sync" }
gpui = { git = "https://github.com/zed-industries/zed", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
gpui = [
    "dep:gpui",
    "dep:gpui_platform",
    "dep:wasm-bindgen",
    "string_art_sync/threads",
]

[[bin]]
name = "string_art_gpui"
path = "src/main.rs"
required-features = ["gpui"]

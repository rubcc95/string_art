[package]
name = "string_art_gui"
version = "0.1.0"
authors = ["Rubén Cantón <rubcc95@gmail.com>"]
edition = "2021"

[dependencies]
derive_more = { workspace = true, features = ["deref", "deref_mut", "from"] }
dioxus = { version = "0.6", features = ["router"] }
#dioxus-desktop = { version = "0.6.3", optional = true }
dioxus-free-icons = { version = "0.9.0", features = [
    "material-design-icons-action",
    "material-design-icons-content",
] }
image = { workspace = true }
thiserror = { workspace = true }
string_art_gui_common = { path = "./string_art_gui_common" }

web-sys = { version = "^0.3", features = ["Navigator", "Clipboard"], optional = true }
futures = { version = "^0.3", optional = true }
string_art_gui_web_worker = { path = "string_art_gui_web_worker", optional = true }

arboard = { version = "^3.6", optional = true }
rayon = {version = "1.10.0", optional = true}


[features]
default = ["web"]
web = ["dioxus/web", "web-sys", "string_art_gui_web_worker", "futures"]
desktop = ["dioxus/desktop", "native"]
mobile = ["dioxus/mobile", "native"]
native = ["arboard", "rayon"]

# Flags del build web multihilo. Se cargan con `cargo +nightly web-threads`.
#
# Sin `+atomics` el módulo no usa memoria compartida y `wasm_thread` no puede
# arrancar workers. `+bulk-memory` y `+mutable-globals` completan lo que exige
# instanciar el mismo módulo en varios workers compartiendo la memoria.
#
# Solo aplica al target wasm: el build nativo no se toca.
[target.wasm32-unknown-unknown]
rustflags = [
  "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
  "-C", "link-arg=--shared-memory",
  "-C", "link-arg=--max-memory=1073741824",
  "-C", "link-arg=--import-memory",
  "-C", "link-arg=--export=__wasm_init_tls",
  "-C", "link-arg=--export=__tls_size",
  "-C", "link-arg=--export=__tls_align",
  "-C", "link-arg=--export=__tls_base",
]

# Recompila std y el runtime de pánico desde fuente. El std precompilado de
# wasm32 no trae soporte de atomics, así que sin esto los workers no arrancan.
# Requiere el componente rust-src del toolchain nightly.
[unstable]
build-std = ["std", "panic_abort"]

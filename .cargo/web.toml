# Multithreaded web build flags. Loaded with `cargo +nightly web-threads`.
#
# Without `+atomics` the module does not use shared memory and `wasm_thread` cannot
# start workers. `+bulk-memory` and `+mutable-globals` complete what is required to
# instantiate the same module in several workers sharing memory.
#
# Only applies to the wasm target: the native build is untouched.
[target.wasm32-unknown-unknown]
rustflags = [
  "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
  "-C", "link-arg=--shared-memory",
  "-C", "link-arg=--max-memory=1073741824",
  "-C", "link-arg=--import-memory",
  "-C", "link-arg=--export=__wasm_init_tls",
  "-C", "link-arg=--export=__tls_size",
  "-C", "link-arg=--export=__tls_align",
  "-C", "link-arg=--export=__tls_base",
]

# Rebuilds std and the panic runtime from source. The precompiled wasm32 std
# has no atomics support, so without this the workers do not start.
# Requires the rust-src component of the nightly toolchain.
[unstable]
build-std = ["std", "panic_abort"]

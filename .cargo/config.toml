# Atajos de build web.
#
# `cargo web` compila en estable y sin hilos: sin SharedArrayBuffer, sin
# workers y con un wasm más pequeño. La app usa Serial.
#
# `cargo +nightly web-threads` compila con hilos reales. Necesita nightly +
# rust-src porque hay que recompilar la std de wasm con atomics (ver
# web-threads.toml), y la página tiene que servirse con COOP/COEP.
[alias]
web = "build -p string_art_gpui --target wasm32-unknown-unknown --no-default-features"
web-threads = "build -p string_art_gpui --target wasm32-unknown-unknown --config .cargo/web-threads.toml"

# Web build (wasm) published to GitHub Pages through the Pages deployment API.
#
# Builds on every commit to main, and can also be started manually.
name: Deploy web

on:
  workflow_dispatch:
    inputs:
      threads:
        description: "Multithreaded wasm (nightly). Adds the COOP/COEP service worker."
        type: boolean
        default: true
      profile:
        description: "Cargo profile"
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Pinned nightly. Swatinem/rust-cache includes the rustc version of every
  # installed toolchain in its cache key, so with the rolling `nightly` channel
  # that hash changes every day: the cache gets saved but never restored, and
  # `-Z build-std` rebuilds std from scratch. Bump the date when a newer
  # nightly is wanted.
  NIGHTLY_TOOLCHAIN: nightly-2026-11-19

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          if [ "${{ inputs.threads || 'true' }}" = "true" ]; then
            rustup toolchain install "$NIGHTLY_TOOLCHAIN" --profile minimal \
              --component rust-src --target wasm32-unknown-unknown
          else
            rustup toolchain install stable --profile minimal \
              --target wasm32-unknown-unknown
            rustup default stable
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-${{ inputs.threads || 'true' }}-${{ inputs.profile || 'release' }}

      - name: Install wasm-bindgen-cli
        run: |
          VERSION=$(awk '/^name = "wasm-bindgen"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit }' Cargo.lock)
          echo "wasm-bindgen $VERSION"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Build wasm
        shell: bash
        env:
          THREADS: ${{ inputs.threads || 'true' }}
          PROFILE: ${{ inputs.profile || 'release' }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PROFILE" = "release" ]; then
            flags+=(--release)
          fi
          if [ "$THREADS" = "true" ]; then
            cargo "+$NIGHTLY_TOOLCHAIN" web --locked "${flags[@]}"
          else
            cargo web-serial --locked "${flags[@]}"
          fi

      - name: Run wasm-bindgen
        shell: bash
        env:
          PROFILE: ${{ inputs.profile || 'release' }}
        run: |
          set -euo pipefail
          wasm-bindgen \
            --target web \
            --out-dir string_art_gpui/web \
            --out-name string_art_gpui \
            "target/wasm32-unknown-unknown/${PROFILE}/string_art_gpui.wasm"

      - name: Prepare site
        shell: bash
        env:
          THREADS: ${{ inputs.threads || 'true' }}
        run: |
          set -euo pipefail
          web=string_art_gpui/web
          wasm="$web/string_art_gpui_bg.wasm"
          size=$(stat -c %s "$wasm")
          sed -i -E "s/(name=\"wasm-bytes\" content=\")[0-9]+(\")/\1${size}\2/" "$web/index.html"
          rm -rf site
          mkdir -p site
          cp "$web/index.html" "$web/string_art_gpui.js" "$wasm" "$web"/*.d.ts site/
          if [ "$THREADS" = "true" ]; then
            cp .github/web/coi-serviceworker.js site/
            grep -q "coi-serviceworker.js" site/index.html ||
              sed -i 's#</head>#<script src="coi-serviceworker.js"></script>\n</head>#' site/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "### Web build published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| URL | ${PAGE_URL} |"
            echo "| Threads | \`${{ inputs.threads || 'true' }}\` |"
            echo "| Profile | \`${{ inputs.profile || 'release' }}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

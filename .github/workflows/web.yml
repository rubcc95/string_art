# Web build (wasm) published to a branch that GitHub Pages serves.
#
# Builds on every commit to main, and can also be started manually.
name: Deploy web

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch that GitHub Pages publishes"
        required: false
        default: gh-pages
      threads:
        description: "Multithreaded wasm (nightly). Adds the COOP/COEP service worker."
        type: boolean
        default: true
      profile:
        description: "Cargo profile"
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: write

concurrency:
  group: web-deploy
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          if [ "${{ inputs.threads || 'true' }}" = "true" ]; then
            rustup toolchain install nightly --profile minimal \
              --component rust-src --target wasm32-unknown-unknown
          else
            rustup toolchain install stable --profile minimal \
              --target wasm32-unknown-unknown
            rustup default stable
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-${{ inputs.threads || 'true' }}-${{ inputs.profile || 'release' }}

      - name: Install wasm-bindgen-cli
        run: |
          VERSION=$(awk '/^name = "wasm-bindgen"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit }' Cargo.lock)
          echo "wasm-bindgen $VERSION"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Build wasm
        shell: bash
        env:
          THREADS: ${{ inputs.threads || 'true' }}
          PROFILE: ${{ inputs.profile || 'release' }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PROFILE" = "release" ]; then
            flags+=(--release)
          fi
          if [ "$THREADS" = "true" ]; then
            cargo +nightly web --locked "${flags[@]}"
          else
            cargo web-serial --locked "${flags[@]}"
          fi

      - name: Run wasm-bindgen
        shell: bash
        env:
          PROFILE: ${{ inputs.profile || 'release' }}
        run: |
          set -euo pipefail
          wasm-bindgen \
            --target web \
            --out-dir string_art_gpui/web \
            --out-name string_art_gpui \
            "target/wasm32-unknown-unknown/${PROFILE}/string_art_gpui.wasm"

      - name: Prepare site
        shell: bash
        env:
          THREADS: ${{ inputs.threads || 'true' }}
        run: |
          set -euo pipefail
          web=string_art_gpui/web
          wasm="$web/string_art_gpui_bg.wasm"
          size=$(stat -c %s "$wasm")
          sed -i -E "s/(name=\\"wasm-bytes\\" content=\\")[0-9]+(\\")/\\1${size}\\2/" "$web/index.html"
          rm -rf site
          mkdir -p site
          cp "$web/index.html" "$web/string_art_gpui.js" "$wasm" "$web"/*.d.ts site/
          touch site/.nojekyll
          if [ "$THREADS" = "true" ]; then
            cp .github/web/coi-serviceworker.js site/
            grep -q "coi-serviceworker.js" site/index.html ||
              sed -i 's#</head>#<script src="coi-serviceworker.js"></script>\\n</head>#' site/index.html
          fi

      - name: Publish to the Pages branch
        shell: bash
        env:
          BRANCH: ${{ inputs.branch || 'gh-pages' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd site
          git init -q
          git checkout -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "Web build ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

      - name: Summary
        env:
          BRANCH: ${{ inputs.branch || 'gh-pages' }}
        run: |
          {
            echo "### Web build published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Branch | \`${BRANCH}\` |"
            echo "| Threads | \`${{ inputs.threads || 'true' }}\` |"
            echo "| Profile | \`${{ inputs.profile || 'release' }}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
